<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Zuhair Sait">
    <meta name="description" content="View a gallery of day trading charts, market data, and trading workspaces.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <!-- Start the page header -->
    <header>
        <span>Trading Academy</span>
        <p>Learn the basics of day trading</p>

    <!-- Start the page navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Day Trading Basics</a></li>

            <li class="active"><a href="gallery.html">Trading Gallery</a></li>
        </ul>
    </nav>

    <!-- Start the main content -->
    <main>
        <h1>Trading Gallery</h1>

        <div class="gallery">

            <figure>
                <img src="images/candlestick-chart.webp"
                     alt="Candlestick price chart"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Candlestick Chart</figcaption>
            </figure>

            <figure>
                <img src="images/chart-workspace.webp"
                     alt="Trading chart displayed on a laptop"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Chart Workspace</figcaption>
            </figure>

            <figure>
                <img src="images/market-data.webp"
                     alt="Financial market data displayed on a screen"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Market Data</figcaption>
            </figure>

            <figure>
                <img src="images/market-platform.webp"
                     alt="Electronic trading platform"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Market Platform</figcaption>
            </figure>

            <figure>
                <img src="images/mobile-chart.webp"
                     alt="Market chart displayed on a smartphone"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Mobile Trading Chart</figcaption>
            </figure>

            <figure>
                <img src="images/technical-analysis.webp"
                     alt="Candlestick chart with technical indicators"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Technical Analysis</figcaption>
            </figure>

            <figure>
                <img src="images/trading-laptop.webp"
                     alt="Trader using a laptop with market charts"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Trading Laptop</figcaption>
            </figure>

            <figure>
                <img src="images/trading-screens.webp"
                     alt="Multiple computer screens displaying financial charts"
                     width="300"
                     height="225"
                     loading="lazy">
                <figcaption>Trading Screens</figcaption>
            </figure>

        </div>

    </main>
